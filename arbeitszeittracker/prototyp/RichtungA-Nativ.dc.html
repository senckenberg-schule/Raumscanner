<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Richtung A: Nativ iOS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0062CC}a:hover{color:#004A99}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F2F2F7; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; line-height: 1.3">
<div style="flex: 1; overflow: hidden; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 0 4px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 600; color: #6C6C70; text-transform: uppercase; letter-spacing: 0.3px">Donnerstag, 8. Oktober</span>
<h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: 0.4px">Heute</h1>
</div>
<button type="button" aria-label="Eintrag hinzufügen" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0062CC" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>

<div style="background: #FFFFFF; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600">
<span style="width: 28px; height: 28px; border-radius: 7px; background: #C2410C; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"></path></svg>
</span>
Korrektur
</span>
<span style="font-size: 15px; color: #6C6C70">seit 15:12</span>
</div>
<div style="font-family: ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; font-size: 56px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -1px; line-height: 1">0:42:18</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 50px; border-radius: 12px; border: none; background: #D70015; color: #FFFFFF; font-size: 17px; font-weight: 600">Stopp</button>
<button type="button" style="height: 50px; border-radius: 12px; border: none; background: #E5E5EA; color: #000000; font-size: 17px; font-weight: 600">Feierabend</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: #6C6C70; text-transform: uppercase; letter-spacing: 0.3px; padding: 0 4px">Schnellstart</span>
<div style="background: #FFFFFF; border-radius: 14px; padding: 14px 8px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 14px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
<button type="button" style="border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; font-size: 12px; color: #000000">
<span style="width: 50px; height: 50px; border-radius: 13px; background: {{c.color}}; display: flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<sc-if value="{{c.gBoard}}" hint-placeholder-val="{{ true }}"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M8 20l4-4 4 4"></path></sc-if>
<sc-if value="{{c.gBook}}" hint-placeholder-val="{{ false }}"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></sc-if>
<sc-if value="{{c.gPen}}" hint-placeholder-val="{{ false }}"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"></path><path d="M14 6l3 3"></path></sc-if>
<sc-if value="{{c.gPeople}}" hint-placeholder-val="{{ false }}"><circle cx="9" cy="8" r="3"></circle><circle cx="17" cy="9" r="2.5"></circle><path d="M3 19c0-3 3-5 6-5s6 2 6 5"></path><path d="M15 14.5c3 0 6 1.5 6 4.5"></path></sc-if>
<sc-if value="{{c.gEye}}" hint-placeholder-val="{{ false }}"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></sc-if>
<sc-if value="{{c.gBubble}}" hint-placeholder-val="{{ false }}"><path d="M4 5h16v11H9l-5 4z"></path></sc-if>
<sc-if value="{{c.gFolder}}" hint-placeholder-val="{{ false }}"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></sc-if>
<sc-if value="{{c.gDots}}" hint-placeholder-val="{{ false }}"><circle cx="6" cy="12" r="1.3"></circle><circle cx="12" cy="12" r="1.3"></circle><circle cx="18" cy="12" r="1.3"></circle></sc-if>
</svg>
</span>
{{c.name}}
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; padding: 0 4px">
<span style="font-size: 13px; font-weight: 600; color: #6C6C70; text-transform: uppercase; letter-spacing: 0.3px">Einträge</span>
<span style="font-size: 13px; color: #6C6C70">5:37 h von 8:00 h</span>
</div>
<div style="background: #FFFFFF; border-radius: 14px; overflow: hidden">
<sc-for list="{{entries}}" as="e" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: {{e.border}}">
<span style="width: 10px; height: 10px; border-radius: 5px; background: {{e.color}}; flex: none"></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span>{{e.name}}</span>
<span style="font-size: 15px; color: #6C6C70">{{e.range}}</span>
</div>
<span style="color: #6C6C70; font-variant-numeric: tabular-nums">{{e.dur}}</span>
</div>
</sc-for>
</div>
</div>
</div>

<nav aria-label="Hauptnavigation" style="flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: rgba(249, 249, 249, 0.94); border-top: 1px solid #D1D1D6; padding: 6px 8px 26px">
<a href="#" aria-current="page" style="height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #0062CC; font-size: 10px; font-weight: 600; text-decoration: none">
<svg width="26" height="26" viewBox="0 0 24 24" fill="#0062CC" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"></path></svg>
Heute
</a>
<a href="#" style="height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6C6C70; font-size: 10px; font-weight: 600; text-decoration: none">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6C6C70" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 19v-8M12 19V5M19 19v-6"></path></svg>
Woche
</a>
<a href="#" style="height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6C6C70; font-size: 10px; font-weight: 600; text-decoration: none">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6C6C70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="5"></circle><path d="M8.6 13.2L7 20l5-2.6 5 2.6-1.6-6.8"></path></svg>
Badges
</a>
<a href="#" style="height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6C6C70; font-size: 10px; font-weight: 600; text-decoration: none">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6C6C70" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"></path><circle cx="15.5" cy="7" r="2.3"></circle><circle cx="9.5" cy="17" r="2.3"></circle></svg>
Einstellungen
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      ['Unterricht', '#1F6F5C', 'board'], ['Vorbereitung', '#2F6FB3', 'book'],
      ['Korrektur', '#C2410C', 'pen'], ['Konferenz', '#7C5CBF', 'people'],
      ['Aufsicht', '#A16207', 'eye'], ['Gespräche', '#0E7490', 'bubble'],
      ['Organisation', '#64748B', 'folder'], ['Sonstiges', '#6B7280', 'dots']
    ];
    const cats = raw.map((r) => ({
      name: r[0], color: r[1],
      gBoard: r[2] === 'board', gBook: r[2] === 'book', gPen: r[2] === 'pen', gPeople: r[2] === 'people',
      gEye: r[2] === 'eye', gBubble: r[2] === 'bubble', gFolder: r[2] === 'folder', gDots: r[2] === 'dots'
    }));
    const list = [
      ['Unterricht', '#1F6F5C', '07:55 – 09:30', '1:35 h'],
      ['Aufsicht', '#A16207', '09:30 – 09:50', '0:20 h'],
      ['Unterricht', '#1F6F5C', '09:50 – 11:20', '1:30 h'],
      ['Konferenz', '#7C5CBF', '14:30 – 16:00', '1:30 h']
    ];
    const entries = list.map((e, i) => ({
      name: e[0], color: e[1], range: e[2], dur: e[3],
      border: i < list.length - 1 ? '0.5px solid #D1D1D6' : 'none'
    }));
    return { cats: cats, entries: entries };
  }
}
</script>
</body>
</html>
