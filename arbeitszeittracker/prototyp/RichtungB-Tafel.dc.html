<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cats = [
      ['Unterricht', '#A8E6CF'], ['Vorbereitung', '#9AD0EC'], ['Korrektur', '#F4A6A6'], ['Konferenz', '#CDB4DB'],
      ['Aufsicht', '#F6D365'], ['Gespräche', '#7FD8D1'], ['Organisation', '#D9D4C7'], ['Sonstiges', '#FFCB9A']
    ].map((c) => ({ name: c[0], color: c[1] }));
    const entries = [
      ['Unterricht', '#A8E6CF', '07:55–09:30', '1:35'],
      ['Aufsicht', '#F6D365', '09:30–09:50', '0:20'],
      ['Unterricht', '#A8E6CF', '09:50–11:20', '1:30'],
      ['Konferenz', '#CDB4DB', '14:30–16:00', '1:30']
    ].map((e) => ({ name: e[0], color: e[1], range: e[2], dur: e[3] }));
    return { cats: cats, entries: entries };
