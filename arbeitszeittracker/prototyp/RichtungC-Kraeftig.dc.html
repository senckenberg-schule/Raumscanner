<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Richtung C: Kräftig und frisch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Sora:wght@600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#444444}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; color: #111111; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 16px; line-height: 1.4">
<div style="flex: 1; overflow: hidden; padding: 22px 20px 16px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column">
<span style="font-size: 14px; color: #555555">Do, 8. Oktober</span>
<h1 style="margin: 0; font-family: 'Sora', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.5px">Heute</h1>
</div>
<span style="display: flex; align-items: center; gap: 6px; background: #FFE8DF; color: #8A2A0B; border-radius: 20px; padding: 8px 12px; font-weight: 700; font-size: 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A2A0B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></svg>
9 Tage bis Ferien
</span>
</div>

<div style="display: flex; align-items: center; gap: 18px">
<div style="position: relative; width: 150px; height: 150px; flex: none">
<svg width="150" height="150" viewBox="0 0 150 150" aria-hidden="true">
<circle cx="75" cy="75" r="62" fill="none" stroke="#F1F1EE" stroke-width="16"></circle>
<circle cx="75" cy="75" r="62" fill="none" stroke="#E2471C" stroke-width="16" stroke-linecap="round" stroke-dasharray="273 390" transform="rotate(-90 75 75)"></circle>
</svg>
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-family: 'Sora', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.5px">5:37</span>
<span style="font-size: 13px; color: #555555">von 8:00 h</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; flex: 1">
<div style="display: flex; flex-direction: column">
<span style="font-size: 13px; color: #555555">Unterricht</span>
<span style="font-family: 'Sora', sans-serif; font-weight: 800; font-size: 20px">3:05 h</span>
</div>
<div style="display: flex; flex-direction: column">
<span style="font-size: 13px; color: #555555">Korrektur</span>
<span style="font-family: 'Sora', sans-serif; font-weight: 800; font-size: 20px">0:42 h</span>
</div>
<div style="display: flex; flex-direction: column">
<span style="font-size: 13px; color: #555555">Sonstiges</span>
<span style="font-family: 'Sora', sans-serif; font-weight: 800; font-size: 20px">1:50 h</span>
</div>
</div>
</div>

<div style="background: #111111; color: #FFFFFF; border-radius: 24px; padding: 14px 14px 14px 18px; display: flex; align-items: center; gap: 12px">
<div style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 14px; color: #CFCFCF">Korrektur läuft</span>
<span style="font-family: 'Sora', sans-serif; font-weight: 800; font-size: 30px; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; line-height: 1.1">0:42:18</span>
</div>
<button type="button" aria-label="Feierabend" style="width: 52px; height: 52px; border-radius: 26px; border: 2px solid #555555; background: transparent; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"></path></svg>
</button>
<button type="button" aria-label="Stopp" style="width: 52px; height: 52px; border-radius: 26px; border: none; background: #E2471C; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
</button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
<button type="button" style="height: 64px; border-radius: 18px; border: none; background: {{c.color}}; color: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-weight: 700; font-size: 16px; text-align: left">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none">
<sc-if value="{{c.gBoard}}" hint-placeholder-val="{{ true }}"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M8 20l4-4 4 4"></path></sc-if>
<sc-if value="{{c.gBook}}" hint-placeholder-val="{{ false }}"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></sc-if>
<sc-if value="{{c.gPen}}" hint-placeholder-val="{{ false }}"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"></path><path d="M14 6l3 3"></path></sc-if>
<sc-if value="{{c.gPeople}}" hint-placeholder-val="{{ false }}"><circle cx="9" cy="8" r="3"></circle><circle cx="17" cy="9" r="2.5"></circle><path d="M3 19c0-3 3-5 6-5s6 2 6 5"></path><path d="M15 14.5c3 0 6 1.5 6 4.5"></path></sc-if>
<sc-if value="{{c.gEye}}" hint-placeholder-val="{{ false }}"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></sc-if>
<sc-if value="{{c.gBubble}}" hint-placeholder-val="{{ false }}"><path d="M4 5h16v11H9l-5 4z"></path></sc-if>
<sc-if value="{{c.gFolder}}" hint-placeholder-val="{{ false }}"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></sc-if>
<sc-if value="{{c.gDots}}" hint-placeholder-val="{{ false }}"><circle cx="6" cy="12" r="1.3"></circle><circle cx="12" cy="12" r="1.3"></circle><circle cx="18" cy="12" r="1.3"></circle></sc-if>
</svg>
{{c.name}}
</button>
</sc-for>
</div>
</div>

<nav aria-label="Hauptnavigation" style="flex: none; margin: 0 16px 22px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #111111; border-radius: 28px; padding: 6px">
<a href="#" aria-current="page" style="height: 48px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #111111; font-size: 13px; font-weight: 700; text-decoration: none">Heute</a>
<a href="#" style="height: 48px; display: flex; align-items: center; justify-content: center; color: #E6E6E6; font-size: 13px; font-weight: 700; text-decoration: none">Woche</a>
<a href="#" style="height: 48px; display: flex; align-items: center; justify-content: center; color: #E6E6E6; font-size: 13px; font-weight: 700; text-decoration: none">Badges</a>
<a href="#" aria-label="Einstellungen" style="height: 48px; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E6E6E6" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"></path><circle cx="15.5" cy="7" r="2.3"></circle><circle cx="9.5" cy="17" r="2.3"></circle></svg>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      ['Unterricht', '#0F766E', 'board'], ['Vorbereitung', '#1D4ED8', 'book'],
      ['Korrektur', '#C2410C', 'pen'], ['Konferenz', '#6D28D9', 'people'],
      ['Aufsicht', '#A16207', 'eye'], ['Gespräche', '#0E7490', 'bubble'],
      ['Organisation', '#475569', 'folder'], ['Sonstiges', '#BE185D', 'dots']
    ];
    const cats = raw.map((r) => ({
      name: r[0], color: r[1],
      gBoard: r[2] === 'board', gBook: r[2] === 'book', gPen: r[2] === 'pen', gPeople: r[2] === 'people',
      gEye: r[2] === 'eye', gBubble: r[2] === 'bubble', gFolder: r[2] === 'folder', gDots: r[2] === 'dots'
    }));
    return { cats: cats };
  }
}
</script>
</body>
</html>
